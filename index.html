<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>

    <title>Relato Integrado</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #start-ar,
      #open-link {
        width: 180px;
        height: 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.2;
        padding: 0;
        margin: 0;
        background-color: #01579b;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        z-index: 10;
      }

      /* Alinhamento na tela */
      .button-container {
        position: absolute;
        bottom: 35px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 35px;
        box-sizing: border-box;
        pointer-events: none; /* para permitir clique em botões filhos sem afetar layout */
      }

      /* Reativa o clique nos botões */
      .button-container button {
        pointer-events: all;
      }
    </style>
  </head>

  <body>
    <model-viewer
      id="viewer"
      src="assets/relato_onepage.glb"
      ios-src="assets/relato_onepage.usdz"
      style="width: 100vw; height: 90vh"
      camera-controls
      shadow-intensity="2"
      touch-action="pan-y"
      ar
      scale="0.1 0.1 0.1"
    >
      <button id="start-ar" slot="ar-button">Começar<br>experiência AR</button>
    </model-viewer>

    <div class="button-container">
      <button id="open-link" onclick="window.open('https://us-west-2.graphassets.com/AnBrQA5RSVi98Y0U0Y7Qmz/cmapg0df9ra5t07n69dv2lb4y', '_blank')">
        Conferir<br>relato
      </button>
    </div>
  </body>
</html>
