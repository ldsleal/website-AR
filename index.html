<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>

    <title>Relato Integrado</title>

    <style>
      #start-ar {
        width: 150px;
        height: 60px;
        position: absolute;
        right: 35px;
        bottom: 35px;
        background-color: #0254a4;
        color: white;
        border: none;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        z-index: 10;
      }

      #open-link {
        width: 150px;
        height: 60px;
        position: absolute;
        left: 35px;
        bottom: 35px;
        background-color: #0254a4;
        color: white;
        border: none;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <model-viewer
      id="viewer"
      src="assets/relato_elevado.glb"
      ios-src="assets/relato_elevado.usdz"
      style="width: 100vw; height: 90vh"
      camera-controls
      shadow-intensity="2"
      touch-action="pan-y"
      ar
      scale="0.5 0.5 0.5"
    >
      <button id="start-ar" slot="ar-button">Começar experiência AR</button>
      <button id="open-link" onclick="window.open('https://us-west-2.graphassets.com/AnBrQA5RSVi98Y0U0Y7Qmz/cmapg0df9ra5t07n69dv2lb4y', '_blank')">
        Conferir <br> relato
      </button>
    </model-viewer>

  </body>
</html>
